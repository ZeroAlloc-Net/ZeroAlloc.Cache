name: CI

on:
  push:
    branches:
      - main
      - 'release-please--**'
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          # Installs the SDK global.json pins. Without it the job never installs
          # that SDK at all and only works when the runner image happens to ship one
          # satisfying the pin, which is how a publish failed on a lagging image.
          global-json-file: global.json
          dotnet-version: '10.0.x'

      - name: Restore tools
        run: dotnet tool restore

      - name: Determine version
        id: gitversion
        run: echo "semver=$(dotnet gitversion /output json /showvariable SemVer)" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release -p:Version=${{ steps.gitversion.outputs.semver }} --no-restore

      - name: Test
        run: dotnet test -c Release --no-build

      - name: Pack ZeroAlloc.Cache
        run: >
          dotnet pack src/ZeroAlloc.Cache/ZeroAlloc.Cache.csproj
          -c Release -p:Version=${{ steps.gitversion.outputs.semver }}
          --no-build -o ./artifacts

      - name: Pack ZeroAlloc.Cache.Generator
        run: >
          dotnet pack src/ZeroAlloc.Cache.Generator/ZeroAlloc.Cache.Generator.csproj
          -c Release -p:Version=${{ steps.gitversion.outputs.semver }}
          --no-build -o ./artifacts

  aot-smoke:
    runs-on: ubuntu-latest
    # About 3x a normal run, which takes under a minute. A hang must fail the job, not hold
    # the runner until the 6-hour default. See #182.
    timeout-minutes: 3
    # Publishes samples/ZeroAlloc.Cache.AotSmoke with PublishAot=true. The
    # generator emits an interface proxy — classic territory for reflection
    # hazards — so this job catches any IL2026/IL3050 regression in the
    # proxy emission before it ships.
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          # Installs the SDK global.json pins. Without it the job never installs
          # that SDK at all and only works when the runner image happens to ship one
          # satisfying the pin, which is how a publish failed on a lagging image.
          global-json-file: global.json
          dotnet-version: '10.0.x'

      - name: Install AOT native toolchain
        # NativeAOT links with clang and the zlib headers. The runner image ships clang, so apt
        # runs only for what is missing. apt has no network timeout of its own: a stalled mirror
        # used to hang this step until the job timed out. See ZeroAlloc-Net/.github#47.
        timeout-minutes: 5
        run: |
          missing=""
          command -v clang >/dev/null || missing="$missing clang"
          dpkg -s zlib1g-dev >/dev/null 2>&1 || missing="$missing zlib1g-dev"
          if [ -z "$missing" ]; then
            echo "clang and zlib1g-dev are already installed"
            exit 0
          fi
          echo "Installing:$missing"
          apt_opts="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          sudo apt-get $apt_opts update
          sudo apt-get $apt_opts install -y $missing

      - name: Restore
        run: dotnet restore samples/ZeroAlloc.Cache.AotSmoke/ZeroAlloc.Cache.AotSmoke.csproj

      - name: Publish AOT
        run: dotnet publish samples/ZeroAlloc.Cache.AotSmoke/ZeroAlloc.Cache.AotSmoke.csproj -r linux-x64 -c Release -o ./aot-out

      # The smoke fails any call that takes over 10 seconds with a message naming it. This outer
      # limit is the backstop in case the process cannot exit; a normal run takes under a second.
      - name: Run AOT binary
        run: timeout -k 5 30 ./aot-out/ZeroAlloc.Cache.AotSmoke

  api-compat:
    uses: ZeroAlloc-Net/.github/.github/workflows/api-compat.yml@main

  # A release PR must mark everything it releases as shipped: the analyzer rules in
  # AnalyzerReleases.Unshipped.md and the API in every PublicAPI.Unshipped.txt. The
  # ship-release-tracking job in release-please.yml commits that move onto the branch;
  # this fails the PR if the move is missing, or if a later commit on the branch adds
  # entries after it. Shared from ZeroAlloc-Net/.github; see ZeroAlloc-Net/.github#38.
  release-tracking:
    if: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'release-please--') }}
    uses: ZeroAlloc-Net/.github/.github/workflows/release-tracking.yml@main
